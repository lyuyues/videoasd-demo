<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoASD — 对照组（被动视频示范）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(180deg, #cfeaff 0%, #f0f8ff 60%, #e8f5ee 100%);
      font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
      color: #5a4a3a; min-height: 100vh;
    }
    .hidden { display: none !important; }
    button { font: inherit; cursor: pointer; border: none; }

    /* Researcher setup */
    .setup { max-width: 560px; margin: 48px auto; background: #fff; border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,.12); padding: 28px 32px; }
    .setup h1 { font-size: 22px; color: #3a3a44; margin-bottom: 4px; }
    .setup .sub { font-size: 14px; color: #8a8a96; margin-bottom: 18px; line-height: 1.5; }
    .setup label { display: block; font-size: 13px; font-weight: 700; color: #6b5640; margin: 14px 0 6px; }
    .setup select, .setup input[type=text] { width: 100%; padding: 10px 12px; border: 2px solid #e6e8ee;
      border-radius: 12px; font: inherit; background: #f8fafc; color: #5a4a3a; }
    .setup .check { display: flex; gap: 8px; align-items: center; font-size: 14px; margin-top: 14px; }
    .setup .note { font-size: 12px; color: #8a8a96; margin-top: 4px; }
    .row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: nowrap; }
    .row > * { white-space: nowrap; text-align: center; }
    .btn-main { background: linear-gradient(135deg, #ffb56a, #ff9d3f); color: #fff; font-weight: 700;
      padding: 12px 18px; border-radius: 16px; font-size: 16px; }
    .btn-sec { background: #f1f3f7; color: #5a4a3a; padding: 12px 14px; border-radius: 16px; font-size: 14px; }

    /* Child-facing player */
    .player { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; padding: 24px; }
    .player .cue { font-size: 24px; font-weight: 700; color: #5a4a3a; }
    .stage { display: grid; }
    .stage video { grid-area: 1 / 1; width: min(92vw, 160vh); max-height: 76vh; border-radius: 22px; background: #000;
      box-shadow: 0 10px 40px rgba(0,0,0,.18); }
    .stage video.off { visibility: hidden; }
    .player .btns { display: flex; gap: 14px; min-height: 52px; }
    .corner { position: fixed; top: 12px; right: 12px; background: rgba(255,255,255,.6); color: #8a8a96;
      font-size: 13px; padding: 6px 10px; border-radius: 10px; }
    .done-card { text-align: center; }
    .done-card .big { font-size: 64px; }
    /* The camera feed MediaPipe reads; never shown. (A preview during calibration sat on
       the bottom-right dot and drew the child's eyes to their own face; the PRR app shows
       none while calibrating either.) */
    #gaze-video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    /* 9-dot calibration (same as the PRR app's, index.html) */
    #cal-overlay { position: fixed; inset: 0; background: rgba(20, 30, 50, 0.92); z-index: 900;
      display: none; justify-content: center; align-items: center; color: #fff; }
    #cal-overlay.show { display: flex; }
    .cal-instructions { font-size: 16px; max-width: 540px; text-align: center; line-height: 1.6; }
    .cal-instructions strong { color: #ffd49a; }
    /* Gone once the first dot is tapped: the child knows what to do by then, and the
       text sat on the centre dot. An error message brings it back. */
    .cal-instructions { transition: opacity .4s ease; }
    .cal-instructions.faded { opacity: 0; }
    .cal-dots { position: absolute; inset: 0; pointer-events: none; }
    .cal-dot { position: absolute; width: 36px; height: 36px; transform: translate(-50%, -50%);
      border-radius: 50%; background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0.2) 70%);
      border: 3px solid rgba(255,255,255,0.6); cursor: pointer; pointer-events: auto;
      animation: cal-pulse 1.5s ease-in-out infinite; }
    @keyframes cal-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.18); }
    }
    .cal-dot.current { background: radial-gradient(circle, #ffd049 0%, rgba(255,200,60,0.3) 70%);
      border-color: #ffd049; box-shadow: 0 0 32px rgba(255, 200, 60, 0.7); }
    .cal-dot.done { background: radial-gradient(circle, #7fc164 0%, rgba(127,193,100,0.2) 70%);
      border-color: #7fc164; animation: none; }
    .cal-progress { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      font-size: 14px; color: rgba(255,255,255,0.7); }
    #cal-cancel { position: absolute; top: 20px; right: 24px; background: rgba(255,255,255,0.1); color: #fff;
      border: 1px solid rgba(255,255,255,0.3); padding: 6px 16px; border-radius: 16px; font-size: 13px; }
  </style>
</head>
<body>
  <!-- Researcher setup (not shown to the child) -->
  <div id="setup" class="setup">
    <h1>对照组：被动视频示范</h1>
    <p class="sub">连续播放一个情境（情境 → 示范行动 → 结果），没有选择也没有预测。事件和视线记录与主程序的视线数据一起保存在本浏览器中，可在此页导出。眼动校准可直接在本页做，与主程序共用。</p>

    <label for="pid">Kid 编号</label>
    <input id="pid" type="text" placeholder="例如 Kid03" />

    <label for="scene">场景</label>
    <select id="scene"></select>

    <label for="topic">主题</label>
    <select id="topic"></select>

    <label for="option">示范行动</label>
    <select id="option"></select>
    <p class="note">默认：主动接近的行动 (a)，作为示范供模仿。待导师确认。</p>

    <div class="row">
      <button class="btn-main" id="start">▶ 开始眼动校准</button>
      <button class="btn-sec" id="start-direct">▶ 直接开始</button>
      <button class="btn-sec" id="export">⬇ 导出数据</button>
      <a class="btn-sec" href="index.html" style="text-decoration:none">← 主程序</a>
    </div>
    <p class="note">「开始眼动校准」：先做 9 点眼动校准，完成后自动播放视频。「直接开始」：跳过校准直接播放，这一次不记录视线。</p>
  </div>

  <!-- Child-facing player -->
  <div id="player" class="player hidden">
    <p class="cue" id="cue"></p>
    <div class="stage"><video id="vA" playsinline preload="auto"></video><video id="vB" class="off" playsinline preload="auto"></video></div>
    <div class="btns">
      <button class="btn-sec hidden" id="replay">↻ 再看一遍</button>
      <button class="btn-main hidden" id="finish">完成 ✓</button>
    </div>
  </div>

  <div id="done" class="player hidden">
    <div class="done-card"><div class="big">🌟</div><p class="cue">看完啦 — 看得真棒！</p>
      <button class="btn-main hidden" id="postquiz">📝 进入后测 →</button></div>
  </div>

  <button id="corner" class="corner hidden">⚙ 设置</button>

  <!-- Calibration overlay -->
  <div id="cal-overlay">
    <button id="cal-cancel">取消</button>
    <div class="cal-instructions" id="cal-instructions"></div>
    <div class="cal-dots" id="cal-dots"></div>
    <div class="cal-progress" id="cal-progress">0 / 9</div>
  </div>
  <video id="gaze-video" autoplay muted playsinline></video>

  <script type="module">
    import { CLIPS } from './clips.js?v=20261020c';
    import { GazeTracker, fitAffine2D } from './gaze.js?v=20261019';
    import { saveSnapshot, beaconSnapshot, onStudyServer } from './save.js?v=20261028';
    import { saveGazeRecord, gazeRecords, sessionGaze } from './gaze_store.js?v=20261031';

    const SCENES = { playground: '游乐场', classroom: '教室', cafeteria: '餐厅', park: '公园' };
    const TOPICS = { make_friends: '交朋友', join_activity: '加入活动', comfort_friend: '安慰朋友' };
    const $ = (id) => document.getElementById(id);

    /* ===== Logging: same store and session id as the PRR app ===== */
    const EVENTS_KEY = 'videoasd_events';
    function newSessionId() {
      const id = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
      sessionStorage.setItem('videoasd_session', id);
      return id;
    }
    let sessionId = sessionStorage.getItem('videoasd_session') || newSessionId();
    let ctx = {};   // { participant, construct, option }
    function logEvent(type, data) {
      try {
        const log = JSON.parse(localStorage.getItem(EVENTS_KEY) || '[]');
        log.push({ ts: Date.now(), session: sessionId, condition: 'baseline', ...ctx, type, ...data });
        localStorage.setItem(EVENTS_KEY, JSON.stringify(log));
      } catch (e) { /* storage full or blocked — skip */ }
    }

    /* ===== Setup form ===== */
    Object.entries(SCENES).forEach(([id, label]) => $('scene').add(new Option(label, id)));
    Object.entries(TOPICS).forEach(([id, label]) => $('topic').add(new Option(label, id)));
    function fillOptions() {
      const clips = CLIPS[`${$('scene').value}_${$('topic').value}`];
      $('option').innerHTML = '';
      Object.entries(clips.options).forEach(([k, o]) => $('option').add(new Option(`${k} · ${o.label}`, k)));
      $('option').value = 'a';
    }
    $('scene').addEventListener('change', fillOptions);
    $('topic').addEventListener('change', fillOptions);
    try {
      $('pid').value = localStorage.getItem('videoasd_participant') || '';
      const last = JSON.parse(localStorage.getItem('videoasd_baseline_last') || 'null');
      if (last) { $('scene').value = last.scene; $('topic').value = last.topic; }
    } catch { /* first run */ }
    fillOptions();

    /* ===== Gaze: every run starts with a fresh calibration =====
       Never a leftover fit from the previous child. The fit is saved per device
       (gaze.js), so the PRR app picks it up too. */
    const gaze = new GazeTracker();
    let gazeOn = false;
    let onCalibrated = null;   // set by Start: what to do once the fit is done

    /* 9-dot calibration: look at the yellow dot, tap it; affine fit when all 9 are done. */
    const CAL_POINTS = [
      [0.10, 0.10], [0.50, 0.10], [0.90, 0.10],
      [0.10, 0.50], [0.50, 0.50], [0.90, 0.50],
      [0.10, 0.90], [0.50, 0.90], [0.90, 0.90],
    ];
    const CAL_HINT = '眼动校准 — 看着<strong>黄色圆点</strong>，然后点击它。<br>点完全部 9 个圆点后，校准自动完成。';
    let calSamples = [], calIdx = 0;
    function renderCalDots() {
      $('cal-dots').innerHTML = '';
      document.getElementById('cal-instructions').classList.toggle('faded', calIdx > 0 && calIdx < CAL_POINTS.length);
      CAL_POINTS.forEach(([x, y], i) => {
        const d = document.createElement('div');
        d.className = 'cal-dot' + (i < calIdx ? ' done' : '') + (i === calIdx ? ' current' : '');
        d.style.left = `${x * 100}%`;
        d.style.top = `${y * 100}%`;
        d.addEventListener('click', () => onCalDotClick(i));
        $('cal-dots').appendChild(d);
      });
      $('cal-progress').textContent = `${calIdx} / ${CAL_POINTS.length}`;
    }
    async function startCalibration() {
      calSamples = []; calIdx = 0;
      $('cal-overlay').classList.add('show');
      $('gaze-video').classList.add('show');
      renderCalDots();
      try {
        if (!gaze.landmarker) {
          $('cal-instructions').innerHTML = '正在加载 MediaPipe 模型……';
          await gaze.init($('gaze-video'));
        }
        await gaze.startCamera();
        gaze.start();
        $('cal-instructions').innerHTML = CAL_HINT;
      } catch (e) {
        console.error('[baseline] gaze init failed:', e);
        $('cal-instructions').innerHTML =
          `<span style="color:#ff8888">加载失败：${e.message || e}</span><br>请检查摄像头权限`;
      }
    }
    function onCalDotClick(i) {
      if (i !== calIdx) return;   // must tap the current one
      const [x, y] = CAL_POINTS[i];
      const bs = gaze.getRawSignal();
      calSamples.push({ x_bs: bs.x_bs, y_bs: bs.y_bs, x_screen: x, y_screen: y });
      calIdx++;
      if (calIdx < CAL_POINTS.length) { renderCalDots(); return; }
      const model = fitAffine2D(calSamples);
      if (!model) {
        $('cal-instructions').classList.remove('faded'); $('cal-instructions').innerHTML = '<span style="color:#ff8888">校准失败：采样数据异常，请重试</span>';
        setTimeout(() => { calIdx = 0; calSamples = []; renderCalDots(); $('cal-instructions').innerHTML = CAL_HINT; }, 1500);
        return;
      }
      gaze.saveCalibration(model);
      logEvent('gaze_calibrated', { n: model.n,
        rmseX: +model.rmseScreen.x.toFixed(4), rmseY: +model.rmseScreen.y.toFixed(4) });
      hideCalibration();
      gazeOn = true;   // camera and tracking loop stay on for the run
      const next = onCalibrated; onCalibrated = null;
      if (next) next();
    }
    function hideCalibration() {
      $('cal-overlay').classList.remove('show');
      $('gaze-video').classList.remove('show');
    }
    $('cal-cancel').addEventListener('click', () => {
      hideCalibration();
      gaze.stop(); gaze.stopCamera();
      onCalibrated = null;
      logEvent('gaze_calibration_cancelled', {});
    });
    let cap = null;   // { key, segment, pts: [], on, off }

    gaze.onFrame(() => {
      if (!gazeOn || !cap) return;
      const v = active();
      if (v.paused || v.ended) return;
      const g = gaze.getScreenGaze();
      if (!g) return;
      const x = Math.max(0, Math.min(1, g.x)) * innerWidth;
      const y = Math.max(0, Math.min(1, g.y)) * innerHeight;
      const r = v.getBoundingClientRect();
      const vx = (x - r.left) / r.width, vy = (y - r.top) / r.height;
      if (vx >= 0 && vx <= 1 && vy >= 0 && vy <= 1) {
        cap.pts.push([+vx.toFixed(3), +vy.toFixed(3), +v.currentTime.toFixed(2)]);
        cap.on++;
      } else {
        cap.off++;
      }
    });
    function startCap(segment) {
      // Same clip names as the PRR app (context / action_<opt> / reaction_<opt>), which
      // are also the AOI file names, so both conditions score against the same boxes.
      const clip = segment === 'context' ? segment : `${segment}_${ctx.option}`;
      cap = gazeOn ? { clip, segment, startedAt: new Date().toISOString(), pts: [], on: 0, off: 0 } : null;
    }
    function stopCap() {
      const c = cap; cap = null;
      if (!c || (c.on + c.off) === 0) return;
      // One record per capture, tagged with Kid ID / session / condition (gaze_store.js).
      const rec = saveGazeRecord({ condition: 'baseline', participantId: ctx.participant, sessionId,
        construct: ctx.construct, clip: c.clip, startedAt: c.startedAt, pts: c.pts, on: c.on, off: c.off });
      logEvent('gaze_summary', { segment: c.segment, clip: c.clip, viewing: rec.viewing, on: c.on, off: c.off,
        onRatio: +(c.on / (c.on + c.off)).toFixed(3) });
    }

    /* ===== Playback: context → action → reaction as one continuous video =====
       Segments are fetched up front into blob URLs, and two stacked <video>
       elements alternate: while one plays, the next segment is already loaded in
       the hidden one, so the hand-off on 'ended' is a swap, not a fresh load. */
    let playlist = [];   // [{ segment, src, url }]  url = blob URL (or src if prefetch failed)
    let idx = 0;
    let viewing = 0;     // 1 = first viewing, 2+ = replays
    const vids = [$('vA'), $('vB')];
    let cur = 0;
    const active = () => vids[cur];

    async function prefetch(list) {
      await Promise.all(list.map(async (seg) => {
        try {
          const r = await fetch(seg.src);
          if (!r.ok) throw new Error(r.status);
          seg.url = URL.createObjectURL(await r.blob());
        } catch { seg.url = seg.src; }   // fall back to streaming
      }));
    }
    function releaseBlobs() {
      playlist.forEach((seg) => { if (seg.url && seg.url.startsWith('blob:')) URL.revokeObjectURL(seg.url); });
    }
    function loadInto(el, seg) { el.src = seg.url; el.load(); }
    function show(i) {
      cur = i;
      vids[i].classList.remove('off');
      vids[1 - i].classList.add('off');
    }

    function playSegment(i) {
      idx = i;
      const v = active(), seg = playlist[i];
      v.currentTime = 0;
      v.play().catch(() => {});
      startCap(seg.segment);
      logEvent('baseline_segment_started', { segment: seg.segment, viewing });
      if (i + 1 < playlist.length) loadInto(vids[1 - cur], playlist[i + 1]);   // stage the next one
    }
    vids.forEach((el) => el.addEventListener('ended', () => {
      if (el !== active()) return;
      stopCap();
      logEvent('baseline_segment_ended', { segment: playlist[idx].segment, viewing });
      if (idx + 1 < playlist.length) {
        show(1 - cur);
        playSegment(idx + 1);
        return;
      }
      logEvent('baseline_viewing_ended', { viewing });
      $('replay').classList.remove('hidden');
      $('finish').classList.remove('hidden');
    }));

    function startViewing() {
      viewing++;
      $('replay').classList.add('hidden');
      $('finish').classList.add('hidden');
      vids[1].removeAttribute('src');
      loadInto(vids[0], playlist[0]);
      show(0);
      playSegment(0);
    }

    // withGaze: 开始眼动校准 (calibrate, then play, gaze recorded) or 直接开始 (play now, no gaze).
    async function begin(withGaze) {
      const scene = $('scene').value, topic = $('topic').value, option = $('option').value;
      const clips = CLIPS[`${scene}_${topic}`];
      const o = clips.options[option];
      const participant = $('pid').value.trim();
      if (onStudyServer && !/^[A-Za-z0-9_-]+$/.test(participant)) {
        $('pid').focus(); $('pid').style.borderColor = '#c0392b';
        return;   // every saved file is named by the Kid ID
      }
      try {
        localStorage.setItem('videoasd_participant', participant);
        localStorage.setItem('videoasd_baseline_last', JSON.stringify({ scene, topic }));
      } catch { /* not critical */ }
      // A different Kid ID than this session's events = a new child: new session id,
      // so two children never share one session file.
      try {
        const own = JSON.parse(localStorage.getItem(EVENTS_KEY) || '[]').filter((e) => e.session === sessionId);
        if (own.length && own[own.length - 1].participant !== participant) sessionId = newSessionId();
      } catch { /* not critical */ }
      ctx = { participant, construct: `${scene}_${topic}`, option };
      releaseBlobs();
      playlist = [
        { segment: 'context', src: clips.context },
        { segment: 'action', src: o.action },
        { segment: 'reaction', src: o.reaction },
      ];
      viewing = 0;
      const $btn = $(withGaze ? 'start' : 'start-direct'), label = $btn.textContent;
      $('start').disabled = $('start-direct').disabled = true;
      $btn.textContent = '加载中…';
      await prefetch(playlist);
      $('start').disabled = $('start-direct').disabled = false;
      $btn.textContent = label;
      const play = () => {
        logEvent('baseline_started', { optionLabel: o.label, gaze: gazeOn, calibrationSkipped: !withGaze });
        $('cue').textContent = `一起来看：${TOPICS[topic]}`;
        $('setup').classList.add('hidden');
        $('done').classList.add('hidden');
        $('player').classList.remove('hidden');
        $('corner').classList.remove('hidden');
        startViewing();
      };
      if (!withGaze) {   // no camera, no gaze points this run
        gaze.stop(); gaze.stopCamera(); gazeOn = false;
        play();
        return;
      }
      // Calibration first; the videos start only once it succeeds.
      onCalibrated = play;
      startCalibration();
    }
    $('start').addEventListener('click', () => begin(true));
    $('start-direct').addEventListener('click', () => begin(false));
    // Save every 60 s while playing, not only at the end -- the backup on this
    // device and the upload both go through saveSnapshot (save.js).
    setInterval(() => {
      if (ctx.participant && !$('player').classList.contains('hidden')) saveSnapshot(serverPayload());
    }, 60000);

    $('replay').addEventListener('click', () => {
      logEvent('baseline_replay', { viewing: viewing + 1 });
      startViewing();
    });

    $('finish').addEventListener('click', () => {
      logEvent('baseline_completed', { viewings: viewing });
      saveSnapshot(serverPayload());
      vids.forEach((el) => el.pause());
      $('player').classList.add('hidden');
      $('done').classList.remove('hidden');
      gaze.stop(); gaze.stopCamera(); gazeOn = false;
      // Straight on to this child's post-quiz for the topic just watched (only the
      // two study topics have quizzes).
      const topic = ctx.construct.split('_').slice(1).join('_');
      $('postquiz').classList.toggle('hidden', !['make_friends', 'join_activity'].includes(topic));
      $('postquiz').onclick = () => {
        logEvent('post_quiz_opened', { topic });
        location.href = `quiz/${topic}_post.html` + (ctx.participant ? `?kid=${encodeURIComponent(ctx.participant)}` : '');
      };
    });

    // Researcher escape hatch: back to setup (logs an abort if mid-run)
    $('corner').addEventListener('click', () => {
      if (!$('player').classList.contains('hidden')) {
        vids.forEach((el) => el.pause()); stopCap();
        logEvent('baseline_aborted', { segment: playlist[idx] && playlist[idx].segment, viewing });
        saveSnapshot(serverPayload());
      }
      gaze.stop(); gaze.stopCamera(); gazeOn = false;
      $('player').classList.add('hidden');
      $('done').classList.add('hidden');
      $('corner').classList.add('hidden');
      $('setup').classList.remove('hidden');
    });

    // Study server: this session's events + gaze -> /api/save-session (see save.js).
    function serverPayload() {
      // Condition too: the PRR page in this tab shares the session id (sessionStorage).
      const events = JSON.parse(localStorage.getItem(EVENTS_KEY) || '[]')
        .filter((e) => e.session === sessionId && e.condition === 'baseline');
      return { kind: 'system', condition: 'baseline', sessionId, participantId: ctx.participant || '',
        construct: ctx.construct, option: ctx.option, events,
        gaze: sessionGaze('baseline', sessionId),   // this child's own gaze only
        calibration: gazeOn ? gaze.model : null };   // the fit this run's gaze points were mapped with
    }
    addEventListener('pagehide', () => { if (ctx.participant) beaconSnapshot(serverPayload()); });

    // Export: same payload shape as the main app's Export
    $('export').addEventListener('click', () => {
      const payload = {
        exportedAt: new Date().toISOString(),
        currentSession: sessionId,
        events: JSON.parse(localStorage.getItem(EVENTS_KEY) || '[]'),
        gaze: gazeRecords(),   // every record on this device (both conditions), see gaze_store.js
        trees: Object.fromEntries(Object.keys(localStorage)
          .filter((k) => k.startsWith('videoasd_tree_'))
          .map((k) => [k.replace('videoasd_tree_', ''), JSON.parse(localStorage.getItem(k))])),
      };
      const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
